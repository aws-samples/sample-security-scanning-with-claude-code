# Static checks for the templates and scripts on every pull request and push to main
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install cfn-lint and Checkov
        run: pip install cfn-lint==1.46.0 checkov==3.3.30
      - name: shellcheck
        run: shellcheck deploy.sh policies/render.sh scripts/*.sh scripts/modules/*.sh
      - name: cfn-lint
        run: cfn-lint infra/*.yaml box/box.yaml policies/*.yaml
      - name: Checkov
        run: checkov -d . --framework cloudformation --quiet --compact
